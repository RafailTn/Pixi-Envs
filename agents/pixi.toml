[workspace]
channels = ["conda-forge"]
name = "agents"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12, <3.13"
polars = ">=1.37.1,<2"

[pypi-dependencies]
torch = "*"
langgraph = "*"
langchain = "*"
langchain-ollama = "*"
langgraph-cli = "*"
ipykernel = "*"
langchain-tavily = "*"
langchain-core = "*"
trustcall = "*"
langchain-community = "*"
biopython = "*"
langgraph-sdk = "*"
langgraph-prebuilt = "*"
pynvim = "*"
langsmith = "*"
dspy = "*"
langgraph-supervisor = "*"
langgraph-swarm = "*"
agentevals = "*"
langchain-mcp-adapters = "*"
langmem = "*"
langchain-experimental = "*"
gradio = ">=6.2.0, <7"
huggingface-hub = { version = ">=0.36.0, <0.37", extras = ["cli"] }
pymupdf = ">=1.26.7, <2"
pypdf = ">=6.6.2, <7"
alphagenome = ">=0.5.1, <0.6"
atlasapprox = ">=0.2.4, <0.3"
requests-cache = ">=1.3.2, <2"
