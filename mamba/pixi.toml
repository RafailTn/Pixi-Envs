[workspace]
channels = ["conda-forge"]
name = "mamba"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
cuda-nvcc = "=12.8"
cuda-cudart-dev = "=12.8"
python = "<3.14.0"
polars = ">=1.35.1,<2"
scikit-learn = ">=1.7.2,<2"

[pypi-dependencies]
mamba-ssm = { version = ">=2.2.6.post3, <3", extras = ["causal-conv1d"] }
lightning = ">=2.5.6, <3"
polars = "*"
fastexcel = ">=0.18.0, <0.19"
ipykernel = ">=7.1.0, <8"
pynvim = ">=0.6.0, <0.7"
