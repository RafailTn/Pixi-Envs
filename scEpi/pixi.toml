[workspace]
name = "scEpi"
version = "0.1.0"
description = "scATAC-seq, scChIP-seq, and scCUT&TAG analysis workspace"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Core Python environment
python = "*"
pip = "*"

# Primary analysis frameworks
episcanpy = "*"
anndata = "*"
scanpy = "*"
snapatac2 = "*" 

# Peak calling and preprocessing
macs3 = "*"
pybedtools = "*"
pysam = "*"
samtools = "*"
bedtools = "*"

# Genomics tools
pybigwig = "*"
pygenometracks = "*"
genomepy = "*"
gffutils = "*"

# Motif analysis
meme = "*"  # FIMO, MEME, etc.

# TF activity and regulation
decoupler = "*"  # TF activity inference
adjusttext = "*"  # for plotting

# Dimensionality reduction
umap-learn = "*"
leidenalg = "*"
python-igraph = "*"
scikit-learn = "*"

# Visualization
matplotlib-base = "*"
seaborn = "*"
plotly = "*"
patchworklib = "*"  # combining plots

# Data handling
pandas = "*"
numpy = "*"
scipy = "*"
h5py = "*"

# Jupyter environment
jupyter = "*"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"

# Utilities
tqdm = "*"
pyyaml = "*"

# Sequence analysis
biopython = "*"
logomaker = "*"  # sequence logos
