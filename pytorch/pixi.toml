[workspace]
channels = ["conda-forge"]
name = "pytorch"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10,<3.13"
cuda = "12.8.*"
pandas = "*"
openpyxl = ">=3.1.5,<4"
polars = ">=1.35.1,<2"
umap-learn = ">=0.5.9.post2,<0.6"
pacmap = ">=0.8.0,<0.9"
catboost = ">=1.2.8,<2"
optuna-integration = ">=4.6.0,<5"
xgboost = ">=3.1.1,<4"
lightgbm = ">=4.6.0,<5"

[pypi-dependencies]
torch = { version = ">=2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = ">=2.7.0", index = "https://download.pytorch.org/whl/cu128" }
pytorch-lightning = "*"
scikit-learn = "*"
pyclustering = "*"
biopython = "*"
optuna = "*"
ipykernel = "*"
pynvim = "*"
fastexcel = ">=0.18.0, <0.19"
xlsxwriter = ">=3.2.9, <4"
seaborn = ">=0.13.2, <0.14"
pyarrow = ">=22.0.0, <23"
sentence-transformers = ">=5.1.2, <6"
umap-learn = "*"
datashader = ">=0.18.2, <0.19"
bokeh = ">=3.8.1, <4"
holoviews = ">=1.22.1, <2"
scikit-image = ">=0.25.2, <0.26"
tensordict = ">=0.10.0, <0.11"
nbformat = ">=4.2.0"
